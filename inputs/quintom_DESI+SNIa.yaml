theory:
  classy:
    input_params: ['H0', 'omega_b', 'omega_cdm', 'lambda_qtm', 'delta_qtm']
    output_params: ['rs_d', 'Omega_m', 'w_qtm', 'Omega_qtm', 'age']
    extra_args:
      Omega_qtm: -1
      Omega_Lambda: 0
      Omega_fld: 0
      coupled_baryon_qtm: yes
      coupled_cdm_qtm: yes
      output: ''
      Neff: 3.044
      N_ncdm: 1
      m_ncdm: 0.06

likelihood:
  bao.desi_2024_bao_all:
  sn.pantheonplus:
    use_abs_mag: False  # Set to False to analytically marginalize Mb

params:
  # 1. Freeze H0 to break the infinite degeneracy valley
  H0: 70.0

  # 2. Sample Omega_m directly
  Omega_m:
    prior: {min: 0.1, max: 0.6}
    ref: {dist: norm, loc: 0.3, scale: 0.01}
    proposal: 0.01
    latex: \Omega_{\rm m}

  # 3. Wide omega_b to act as a free dial for r_d
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.022, scale: 0.005}
    proposal: 0.005
    latex: \omega_b

  # 4. Analytically calculate omega_cdm to feed back to Classy
  omega_cdm:
    value: 'lambda Omega_m, omega_b, H0: Omega_m * (H0 / 100)**2 - omega_b'

  # 5. Your Quintom parameters
  lambda_qtm:
    prior: {min: 0.0, max: 5.0}
    ref: {dist: norm, loc: 0.5, scale: 0.1}
    proposal: 0.1
    latex: \lambda_{\rm qtm}
  delta_qtm:
    prior: {min: -1.0, max: 1.0}
    ref: {dist: norm, loc: 0.1, scale: 0.05}
    proposal: 0.05
    latex: \delta_{\rm qtm}

  # 6. Derived parameters to output
  rs_d:
    derived: true
    latex: r_d
  w_qtm:
    derived: true
    latex: w_{\rm qtm}
  Omega_qtm:
    derived: true
    latex: \Omega_{\rm qtm}
  age:
    derived: true
    latex: \text{Age [Gyr]}

sampler:
  mcmc:
    burn_in: 0
    learn_proposal: true
    max_tries: .inf
    Rminus1_stop: 0.01

output: chains/quintom/DESI+SNIa/quintom_DESI+SNIa