theory:
  classy:
    input_params: ['H0', 'omega_b', 'omega_cdm', 'lambda_qtm', 'delta_qtm']
    output_params: ['comov.snd.hrz.', 'ang.diam.dist.', 'comov.dist.', 'rs_rec', 'da_rec', 'theta_s_100', 'sigma8', 'w_qtm', 'Omega_qtm', 'Omega_m', 'age']
    extra_args:
      Omega_qtm: -1
      Omega_Lambda: 0
      Omega_fld: 0
      coupled_baryon_qtm: yes
      coupled_cdm_qtm: yes
      output: ''
      Neff: 3.044
      N_ncdm: 1
      m_ncdm: 0.06

likelihood:
  planck_2018_lowl.TT: null
  planck_2020_lollipop.lowlB: null
  planck_2020_lollipop.lowlEB: null

params:
  # Sampled
  theta_s_100:
    prior:
      min: 1.03
      max: 1.05
    proposal: 0.01
    latex: \theta_\mathrm{MC}
  logA:
    prior:
      min: 2.6
      max: 3.5
    proposal: 0.0036
    drop: True
    latex: \log(10^{10} A_\mathrm{s})
  A_s:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}
  n_s:
    prior:
      min: 0.9
      max: 1.1
    proposal: 0.0033
    latex: n_\mathrm{s}
  omega_b:
    prior:
      min: 0.017
      max: 0.027
    proposal: 6.5e-5
    latex: \Omega_\mathrm{b}h^2
  omega_cdm:
    prior:
      min: 0.09
      max: 0.15
    proposal: 0.0011
    latex: \Omega_\mathrm{c}h^2
  H0:
    latex: H_0
  sigma8:
    latex: \sigma_8
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}

sampler:
  mcmc:
    burn_in: 0
    learn_proposal: true
    max_tries: .inf
    Rminus1_stop: 0.01

output: chains/quintom/lolipop/quintom_lolipop