theory:
  classy:
    input_params: ['H0', 'Omega_m', 'omega_b']
    output_params: ['comov.snd.hrz.', 'ang.diam.dist.', 'comov.dist.', 'rs_rec', 'da_rec', 'theta_s_100', 'sigma8']
    extra_args:
      coupled_baryon_qtm: no
      coupled_cdm_qtm: no
      Neff: 3.044
      N_ncdm: 1
      m_ncdm: 0.06

likelihood:
  cmb_distance_prior.CMB_Distance_Prior:
    python_path: likelihood/

params:
  H0:
    prior: {min: 50, max: 100}
    ref: {dist: norm, loc: 67.4, scale: 0.5}
    proposal: 0.5
    latex: H_0
  Omega_m:
    prior: {min: 0.1, max: 0.6}
    ref: {dist: norm, loc: 0.3, scale: 0.01}
    proposal: 0.01
    latex: \Omega_{\rm m}
  omega_b:
    prior: {min: 0.005, max: 0.05}
    ref: {dist: norm, loc: 0.02239, scale: 0.00010}
    proposal: 0.00010
    latex: \Omega_{\rm b} h^2

  omega_cdm:
    value: 'lambda Omega_m, omega_b, H0: Omega_m * (H0 / 100)**2 - omega_b'
    latex: \Omega_{\rm cdm} h^2
  theta_s_100:
    derived: true
    latex: 100\theta_{\rm s}
  sigma8:
    derived: true
    latex: \sigma_8
  rs_rec:
    drop: True
  da_rec:
    drop: True
   
sampler:
  mcmc:
    burn_in: 0
    learn_proposal: true
    max_tries: .inf
    Rminus1_stop: 0.01

output: chains/lcdm/CMB/lcdm_CMB